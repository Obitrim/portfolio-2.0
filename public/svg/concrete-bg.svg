<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65 0.65" numOctaves="4" seed="2" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blended"/>
      <feComponentTransfer in="blended">
        <feFuncA type="linear" slope="1"/>
      </feComponentTransfer>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Base concrete surface -->
  <rect width="1440" height="900" fill="#f0efed"/>

  <!-- Noise grain texture overlay -->
  <rect width="1440" height="900" fill="#d8d4ce" opacity="0.12" filter="url(#noise)"/>

  <!-- Paint smear marks (horizontal brushstrokes) -->
  <path d="M 0 120 Q 200 110 400 125 Q 600 140 800 118 Q 1000 100 1200 128 Q 1350 140 1440 120 L 1440 140 Q 1200 155 1000 135 Q 800 118 600 148 Q 400 160 200 140 Q 100 132 0 145 Z" fill="#e8e4de" opacity="0.6"/>

  <path d="M 0 400 Q 300 385 600 405 Q 900 425 1200 398 Q 1350 388 1440 405 L 1440 422 Q 1200 412 900 438 Q 600 458 300 415 Q 150 400 0 418 Z" fill="#e5e0d9" opacity="0.5"/>

  <path d="M 0 650 Q 250 635 500 655 Q 750 675 1000 648 Q 1250 628 1440 650 L 1440 668 Q 1200 682 950 662 Q 700 640 450 672 Q 200 695 0 672 Z" fill="#e0dbd4" opacity="0.4"/>

  <!-- Faint diagonal scratch marks (surface texture) -->
  <line x1="80" y1="0" x2="0" y2="80" stroke="#ccc9c2" stroke-width="1" opacity="0.3"/>
  <line x1="200" y1="0" x2="100" y2="100" stroke="#ccc9c2" stroke-width="0.5" opacity="0.25"/>
  <line x1="350" y1="0" x2="200" y2="150" stroke="#ccc9c2" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="0" x2="450" y2="150" stroke="#ccc9c2" stroke-width="0.5" opacity="0.2"/>
  <line x1="900" y1="0" x2="750" y2="150" stroke="#ccc9c2" stroke-width="1" opacity="0.15"/>
  <line x1="1200" y1="0" x2="1050" y2="150" stroke="#ccc9c2" stroke-width="0.5" opacity="0.18"/>
  <line x1="1440" y1="50" x2="1300" y2="190" stroke="#ccc9c2" stroke-width="1" opacity="0.15"/>

  <!-- Paint splatter spots (bottom area, faint) -->
  <circle cx="120" cy="780" r="18" fill="#e0dbd2" opacity="0.5"/>
  <circle cx="135" cy="795" r="8" fill="#dbd5cc" opacity="0.4"/>
  <circle cx="105" cy="798" r="5" fill="#dbd5cc" opacity="0.35"/>
  <circle cx="142" cy="775" r="3" fill="#dbd5cc" opacity="0.3"/>

  <circle cx="900" cy="820" r="22" fill="#e0dbd2" opacity="0.45"/>
  <circle cx="925" cy="835" r="10" fill="#dbd5cc" opacity="0.38"/>
  <circle cx="880" cy="840" r="6" fill="#dbd5cc" opacity="0.3"/>

  <!-- Faint blue paint wash (left side) -->
  <ellipse cx="-50" cy="350" rx="200" ry="280" fill="#c5d8f0" opacity="0.06" filter="url(#softblur)"/>

  <!-- Faint orange wash (bottom right) -->
  <ellipse cx="1500" cy="700" rx="250" ry="200" fill="#f5d0a8" opacity="0.06" filter="url(#softblur)"/>

  <!-- Horizontal mortar lines (subtle brick pattern) -->
  <line x1="0" y1="290" x2="1440" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.35"/>
  <line x1="0" y1="580" x2="1440" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.3"/>
  <line x1="0" y1="870" x2="1440" y2="870" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>

  <!-- Vertical mortar lines (offset alternating) -->
  <line x1="240" y1="0" x2="240" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
  <line x1="480" y1="0" x2="480" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.2"/>
  <line x1="720" y1="0" x2="720" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
  <line x1="960" y1="0" x2="960" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.2"/>
  <line x1="1200" y1="0" x2="1200" y2="290" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
  <line x1="120" y1="290" x2="120" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.2"/>
  <line x1="360" y1="290" x2="360" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
  <line x1="600" y1="290" x2="600" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.2"/>
  <line x1="840" y1="290" x2="840" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
  <line x1="1080" y1="290" x2="1080" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.2"/>
  <line x1="1320" y1="290" x2="1320" y2="580" stroke="#d8d3cc" stroke-width="0.5" opacity="0.25"/>
</svg>
