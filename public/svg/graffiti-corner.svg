  <!-- Drip 2 -->
  <path d="M 240 120 Q 238 145 242 165 Q 244 185 240 210 L 240 235 Q 242 248 238 258 Q 237 264 241 265 Q 245 266 243 260 Q 240 252 243 240 L 243 212 Q 246 188 242 168 Q 240 146 243 120 Z" fill="#f07020" opacity="0.85"/>
  <ellipse cx="241" cy="270" rx="5" ry="8" fill="#f07020" opacity="0.85"/>

  <!-- Drip 3 - short -->
  <path d="M 90 300 Q 88 315 92 328 L 92 342 Q 94 350 90 356 Q 89 360 93 361 Q 96 362 94 357 Q 91 350 94 342 L 94 326 Q 97 314 92 300 Z" fill="#f07020" opacity="0.8"/>
  <ellipse cx="92" cy="365" rx="4" ry="6" fill="#f07020" opacity="0.8"/>

  <!-- Drip 4 - top right area -->
  <path d="M 310 80 Q 308 100 312 118 Q 314 135 310 152 L 310 168 Q 312 176 308 183 Q 307 187 311 188 Q 314 189 313 184 Q 310 177 313 169 L 313 150 Q 316 135 312 118 Q 310 100 313 80 Z" fill="#f07020" opacity="0.75"/>
