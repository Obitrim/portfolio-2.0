  <circle cx="330" cy="40" r="3" fill="#f07020" opacity="0.7"/>
  <circle cx="340" cy="52" r="2" fill="#f07020" opacity="0.6"/>
  <circle cx="322" cy="55" r="2.5" fill="#f07020" opacity="0.65"/>
  <circle cx="344" cy="32" r="1.5" fill="#f07020" opacity="0.5"/>
  <circle cx="335" cy="28" r="2" fill="#f07020" opacity="0.55"/>

