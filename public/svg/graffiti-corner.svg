  <path d="M 160 180 Q 158 200 162 220 Q 163 240 160 260 Q 158 275 162 290 L 162 310 Q 164 320 160 330 Q 159 335 162 336 Q 166 337 164 332 Q 162 325 165 312 L 165 290 Q 168 274 164 260 Q 162 242 165 222 Q 168 202 165 182 Z" fill="#f07020" opacity="0.9"/>
  <!-- Drip blob 1 -->
